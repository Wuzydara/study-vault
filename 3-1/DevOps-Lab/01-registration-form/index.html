<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab Registration Form</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="form-container">
    <h2>Student Registration</h2>
    <p class="subtitle">Please fill out your details below.</p>

    <form action="#" method="POST">
      <div class="input-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" placeholder="John Doe" required />
      </div>

      <div class="input-group">
        <label for="email">Email Address</label>
      	 <input type="email" id="email" name="email" placeholder="student@example.com" required />
      </div>

      <div class="input-group">
        <label for="student-id">Student ID</label>
        <input type="text" id="student-id" name="student_id" placeholder="e.g. 123456" required />
      </div>

      <div class="input-group">
        <label for="course">Course / Department</label>
        <select id="course" name="course" required>
          <option value="" disabled selected>Select your course</option>
          <option value="cs">Computer Science</option>
          <option value="devops">DevOps & Cloud</option>
          <option value="it">Information Technology</option>
        </select>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required />
      </div>

      <button type="submit" class="submit-btn">Register</button>
    </form>
  </div>
</body>
</html>
